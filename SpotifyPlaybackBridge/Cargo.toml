[package]
name = "now-playing-spotify-bridge"
version = "2.4.0"
edition = "2024"
license = "MIT"

[dependencies]
librespot = { version = "0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
rodio = "0.21.1"
